name: terrashift

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: terrashift-nginx
    ports:
      # Bound to localhost:8080 so host Nginx + Certbot can terminate HTTPS on :80/:443.
      # For plain HTTP local dev without host Nginx, change to "80:80".
      - "${NGINX_BIND:-127.0.0.1:8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - main-service
      - agronomy-engine
    restart: unless-stopped

  main-service:
    build: ./main-service
    container_name: terrashift-main
    env_file:
      - path: .env
        required: false
    environment:
      PORT: ${MAIN_SERVICE_PORT:-4000}
      ATLAS_MONGO_URI: ${ATLAS_MONGO_URI:-}
      GENERAL_MONGO_URI: ${GENERAL_MONGO_URI:-${ATLAS_MONGO_URI:-mongodb://localhost:27017}/general_db?retryWrites=true&w=majority}
      REDIS_URL: ${REDIS_URL:-redis://redis-cache:6379}
      AGRONOMY_ENGINE_URL: ${AGRONOMY_ENGINE_URL:-http://agronomy-engine:8000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-please-32chars}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    expose:
      - "4000"
    depends_on:
      redis-cache:
        condition: service_healthy
      agronomy-engine:
        condition: service_started
    restart: unless-stopped

  agronomy-engine:
    build: ./agronomy-engine
    container_name: terrashift-agronomy
    env_file:
      - path: .env
        required: false
    environment:
      ATLAS_MONGO_URI: ${ATLAS_MONGO_URI:-}
      LOOKUP_MONGO_URI: ${LOOKUP_MONGO_URI:-${ATLAS_MONGO_URI:-}/lookup_db?retryWrites=true&w=majority}
      GENERAL_MONGO_URI: ${GENERAL_MONGO_URI:-${ATLAS_MONGO_URI:-}/general_db?retryWrites=true&w=majority}
      REDIS_URL: ${REDIS_URL:-redis://redis-cache:6379}
      EARTHDATA_TOKEN: ${EARTHDATA_TOKEN:-}
      APPEEARS_BASE_URL: ${APPEEARS_BASE_URL:-https://appeears.earthdatacloud.nasa.gov/api}
      SOILGRIDS_BASE_URL: ${SOILGRIDS_BASE_URL:-https://rest.isric.org/soilgrids/v2.0/properties/query}
      SOILGRIDS_TIMEOUT_SECONDS: ${SOILGRIDS_TIMEOUT_SECONDS:-8}
      GA_POPULATION: ${GA_POPULATION:-50}
      GA_GENERATIONS: ${GA_GENERATIONS:-30}
    expose:
      - "8000"
    depends_on:
      redis-cache:
        condition: service_healthy
    restart: unless-stopped

  redis-cache:
    image: redis:7-alpine
    container_name: terrashift-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Optional: run the frontend in Docker (`docker compose --profile full up`).
  # In production the frontend is deployed on Vercel.
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost/api}
    container_name: terrashift-frontend
    expose:
      - "3000"
    profiles: ["full"]
    restart: unless-stopped

volumes:
  redis-data:
