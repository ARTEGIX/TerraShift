name: terrashift

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: terrashift-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - main-service
      - agronomy-engine
    restart: unless-stopped

  main-service:
    build: ./main-service
    container_name: terrashift-main
    env_file: .env
    environment:
      PORT: ${MAIN_SERVICE_PORT:-4000}
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/terrashift}
      REDIS_URL: ${REDIS_URL:-redis://redis-cache:6379}
      AGRONOMY_ENGINE_URL: ${AGRONOMY_ENGINE_URL:-http://agronomy-engine:8000}
    expose:
      - "4000"
    depends_on:
      mongo:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      agronomy-engine:
        condition: service_started
    restart: unless-stopped

  agronomy-engine:
    build: ./agronomy-engine
    container_name: terrashift-agronomy
    env_file: .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis-cache:6379}
    expose:
      - "8000"
    depends_on:
      redis-cache:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: terrashift-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis-cache:
    image: redis:7-alpine
    container_name: terrashift-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Optional: run the frontend in Docker too (`docker compose --profile full up`).
  # In production the frontend is deployed on Vercel.
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost/api}
    container_name: terrashift-frontend
    expose:
      - "3000"
    profiles: ["full"]
    restart: unless-stopped

volumes:
  mongo-data:
  redis-data:
