worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # Docker's embedded DNS — lets nginx start even if optional upstreams (frontend) are absent.
  resolver 127.0.0.11 valid=10s ipv6=off;

  gzip on;
  gzip_types application/json text/plain text/css application/javascript image/svg+xml;
  gzip_min_length 1024;

  client_max_body_size 5m;   # GeoJSON polygons can be large

  log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                  '"$http_user_agent" rt=$request_time urt=$upstream_response_time';
  access_log /var/log/nginx/access.log main;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout    60s;   # GA + NASA fetch can take a few seconds

    # ---- Public REST API (auth, farms, analyses) ----
    location /api/ {
      set $main_upstream http://main-service:4000;
      proxy_pass $main_upstream;
    }

    # ---- Agronomy engine (debug / Swagger only; disable in prod) ----
    location /engine/ {
      set $engine_upstream http://agronomy-engine:8000;
      rewrite ^/engine/(.*)$ /$1 break;
      proxy_pass $engine_upstream;
    }

    location = /nginx-health {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }

    # ---- Frontend (only when `--profile full` is running; Vercel in prod) ----
    location / {
      set $frontend_upstream http://frontend:3000;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_pass $frontend_upstream;
      error_page 502 503 504 = @frontend_down;
    }

    location @frontend_down {
      default_type text/plain;
      return 200 "TerraShift API gateway is up. Frontend not running in Docker — use `npm run dev` in ./frontend or the Vercel deployment.\n";
    }
  }
}
